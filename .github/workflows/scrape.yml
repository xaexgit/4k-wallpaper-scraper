name: 4K Wallpapers Link Scraper

on:
  schedule:
    # Runs every Monday at 06:00 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape Wallpaper Links
        run: |
          python scraper.py

      - name: Verify Generated 4k_nature.json
        run: |
          if [ ! -f 4k_nature.json ]; then
            echo "::error::4k_nature.json was not created!"
            exit 1
          fi
          echo "=== Preview 4k_nature.json ==="
          head -n 25 4k_nature.json

      - name: Commit 4k_nature.json to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add 4k_nature.json
          if git diff --staged --quiet; then
            echo "No changes in 4k_nature.json."
          else
            git commit -m "update: refresh 4k_nature.json live wallpaper links [skip ci]"
            git push
          fi

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v$(date -u +'%Y.%m.%d-%H%M')"
          gh release create "$TAG_NAME" \
            4k_nature.json \
            --title "Nature Wallpaper Links ($TAG_NAME)" \
            --notes "Automated weekly scrape of live 4K nature wallpaper links."
