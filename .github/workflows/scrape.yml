name: Dynamic 4K Wallpaper Link Scraper

on:
  schedule:
    # Runs every Monday at 06:00 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape Wallpapers from links.json
        run: |
          python scraper.py

      - name: Verify Generated JSON Files
        run: |
          ls -la 4k_*.json || echo "No JSON files generated!"

      - name: Commit Generated JSON Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add 4k_*.json
          if git diff --staged --quiet; then
            echo "No changes detected across wallpaper files."
          else
            git commit -m "update: refresh live wallpaper category json files [skip ci]"
            git push
          fi

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v$(date -u +'%Y.%m.%d-%H%M')"
          gh release create "$TAG_NAME" \
            4k_*.json \
            --title "Live Wallpaper Links Update ($TAG_NAME)" \
            --notes "Automated scrape for all categories configured in links.json."
