name: Scrape Alpha Coders

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight UTC
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest

    # Required permissions to commit updated files back to your repository
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Scraper Script
        run: python scraper.py

      - name: Commit and Push Updated Links
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add links.json
          # Only commit and push if links.json has changed
          git diff --staged --quiet || (git commit -m "Automated update: Refresh links.json from Alpha Coders" && git push)
